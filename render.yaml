services:
  # Backend Node.js com Puppeteer
  - type: web
    name: scraper-backend
    runtime: node
    plan: free
    branch: main
    rootDir: backend   
    healthCheckPath: /health
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: "22"

  # Frontend Vite
  - type: web
    name: scraper-frontend
    runtime: node
    plan: free
    branch: main
    rootDir: frontend  
    buildCommand: "npm install && npm run build"
    startCommand: "npm run preview"
    envVars:
      - key: NODE_VERSION
        value: "22"
    publishDirectory: dist
